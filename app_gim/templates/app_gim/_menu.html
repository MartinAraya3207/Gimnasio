<header class="barra">
  <a class="marca" href="{% url 'app_gim:portada' %}">Gimnasio de Barrio</a>
  <nav>
    <a href="{% url 'app_gim:portada' %}">Inicio</a>
    <a href="{% url 'app_gim:listado' %}">Rutinas</a>

    {% if user.is_authenticated %}
      <a href="{% url 'app_gim:mis_rutinas' %}">Mis rutinas</a>
      <a href="{% url 'app_gim:mis_solicitudes' %}">Mis solicitudes</a>
      <a href="{% url 'app_gim:solicitudes_recibidas' %}">Solicitudes recibidas</a>
      <a href="{% url 'app_gim:rutina_crear' %}">Nueva rutina</a>
      <a href="{% url 'app_gim:disciplinas' %}">Disciplinas</a>
      <a href="{% url 'app_gim:mi_cuenta' %}">Mi cuenta</a>
      <span class="usuario">{{ user.username }}</span>
      <form method="post" action="{% url 'app_gim:salida' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="boton">Cerrar sesión</button>
      </form>
    {% else %}
      <a href="{% url 'app_gim:ingreso' %}">Ingresar</a>
      <a href="{% url 'app_gim:registro' %}">Registrarse</a>
    {% endif %}
  </nav>
</header>
